services:
  server:
    build: ./server
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://sweepy:sweepy@db:5432/sweepy
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER}
      AUTHENTIK_JWKS_URI: ${AUTHENTIK_JWKS_URI}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: sweepy
      POSTGRES_USER: sweepy
      POSTGRES_PASSWORD: sweepy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweepy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
